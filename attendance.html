<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UB Cafe — Staff Check-In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F2E4;
    --paper-line:#E4D9BC;
    --ink:#1E2A24;
    --ink-soft:#4B5A50;
    --brass:#B8892B;
    --brass-dark:#8C6A20;
    --credit:#2C6E63;
    --debit:#A63D2F;
    --card:#FFFDF7;
    --danger-bg:#F6E3DF;
    --ok-bg:#E1EEE9;
    --shadow: 0 1px 2px rgba(30,42,36,0.06), 0 8px 24px rgba(30,42,36,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}
  body{
    background-image: radial-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }

  .wrap{max-width:520px;margin:0 auto;padding:36px 18px 60px;}

  /* ---------- Clock hero ---------- */
  .hero{text-align:center;margin-bottom:26px;animation:dropIn .6s cubic-bezier(.2,.9,.3,1.2) both;}
  @keyframes dropIn{from{opacity:0;transform:translateY(-14px);}to{opacity:1;transform:translateY(0);}}
  .clock-wrap{position:relative;width:132px;height:132px;margin:0 auto 14px;}
  .clock-face{
    width:132px;height:132px;border-radius:50%;background:var(--card);
    border:3px solid var(--ink);box-shadow:var(--shadow);position:relative;
  }
  .clock-face::before{
    content:"UB";position:absolute;top:50%;left:50%;transform:translate(-50%,-70%);
    font-family:'Fraunces',serif;font-weight:700;font-size:11px;color:var(--brass);letter-spacing:.08em;
  }
  .tick{position:absolute;background:var(--ink-soft);border-radius:1px;}
  .hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;background:var(--ink);border-radius:3px;}
  .hand.hour{width:4px;height:34px;margin-left:-2px;background:var(--ink);}
  .hand.minute{width:3px;height:48px;margin-left:-1.5px;background:var(--ink-soft);}
  .hand.second{width:1.5px;height:52px;margin-left:-0.75px;background:var(--debit);}
  .clock-pin{position:absolute;top:50%;left:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--brass);border:1.5px solid var(--ink);}

  .hero h1{font-family:'Fraunces',serif;font-weight:800;font-size:26px;margin:0;letter-spacing:-0.01em;}
  .hero .sub{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;margin-top:3px;}
  .hero .now{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--brass-dark);margin-top:10px;font-weight:600;}

  .panel{
    background:var(--card);border:1px solid var(--ink);border-radius:14px;padding:22px;box-shadow:var(--shadow);
    animation:riseIn .5s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes riseIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  .panel + .panel{margin-top:16px;animation-delay:.08s;}

  .section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);margin-bottom:12px;}

  /* ---------- Employee cards ---------- */
  .emp-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(96px, 1fr));gap:9px;margin-bottom:4px;}
  .emp-card{
    display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px;
    border:1.5px solid var(--paper-line);border-radius:11px;background:#fff;cursor:pointer;
    transition:transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .emp-card:hover{border-color:var(--brass);transform:translateY(-2px);box-shadow:0 4px 10px rgba(30,42,36,.08);}
  .emp-card:active{transform:translateY(0) scale(.97);}
  .emp-card.selected{border-color:var(--ink);background:var(--ink);box-shadow:0 4px 14px rgba(30,42,36,.22);}
  .emp-card.selected .emp-avatar{background:var(--brass);color:var(--ink);}
  .emp-card.selected .emp-name{color:var(--paper);}
  .emp-card.done{opacity:.55;}
  .emp-avatar{
    width:40px;height:40px;border-radius:50%;background:var(--paper-line);color:var(--ink);
    display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:14px;
    transition:background .15s ease, color .15s ease;
  }
  .emp-name{font-size:12px;font-weight:600;text-align:center;line-height:1.25;transition:color .15s ease;}
  .emp-done-tag{font-size:9.5px;color:var(--credit);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .emp-empty{grid-column:1/-1;text-align:center;padding:20px 10px;color:var(--ink-soft);font-size:13px;}

  button.primary{
    font-family:'Inter',sans-serif;font-weight:700;font-size:15px;background:var(--ink);color:var(--paper);
    border:none;padding:14px 20px;border-radius:10px;cursor:pointer;width:100%;margin-top:16px;
    transition:background .15s ease, transform .1s ease;
  }
  button.primary:disabled{background:#B7BDB8;cursor:not-allowed;}
  button.primary:hover:not(:disabled){background:#0f1913;}
  button.primary:active:not(:disabled){transform:scale(.98);}
  button.primary.checked-in{background:var(--credit);}

  .msg{font-size:13px;margin-top:10px;padding:9px 12px;border-radius:8px;display:none;text-align:center;}
  .msg.show{display:block;}
  .msg.err{background:var(--danger-bg);color:var(--debit);}
  .msg.ok{background:var(--ok-bg);color:var(--credit);}

  /* ---------- Stamp confirmation ---------- */
  .stamp-overlay{
    position:fixed;inset:0;background:rgba(30,42,36,.55);display:none;align-items:center;justify-content:center;z-index:50;
    padding:24px;
  }
  .stamp-overlay.show{display:flex;}
  .stamp{
    width:210px;height:210px;border-radius:50%;border:5px solid var(--credit);color:var(--credit);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    background:rgba(225,238,233,.97);transform:scale(.3) rotate(-25deg);opacity:0;
    animation:stampDown .55s cubic-bezier(.17,.85,.35,1.3) forwards;
  }
  @keyframes stampDown{
    0%{transform:scale(.3) rotate(-25deg);opacity:0;}
    60%{transform:scale(1.08) rotate(-7deg);opacity:1;}
    100%{transform:scale(1) rotate(-9deg);opacity:1;}
  }
  .stamp .stamp-check{font-size:44px;line-height:1;}
  .stamp .stamp-title{font-family:'Fraunces',serif;font-weight:800;font-size:17px;letter-spacing:.03em;margin-top:4px;}
  .stamp .stamp-name{font-size:12.5px;font-weight:600;margin-top:6px;padding:0 20px;color:var(--ink);}
  .stamp .stamp-time{font-family:'IBM Plex Mono',monospace;font-size:11px;margin-top:4px;color:var(--ink-soft);}
  .stamp-dismiss{
    margin-top:20px;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);border-radius:9px;
    padding:9px 22px;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;cursor:pointer;
    opacity:0;animation:fadeUpBtn .3s ease .4s forwards;
  }
  @keyframes fadeUpBtn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- Today's list ---------- */
  .checkin-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--paper-line);font-size:13.5px;}
  .checkin-row:last-child{border-bottom:none;}
  .checkin-row .ci-left{display:flex;align-items:center;gap:9px;}
  .checkin-row .mini-avatar{
    width:26px;height:26px;border-radius:50%;background:var(--paper-line);display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:700;font-size:10.5px;flex:0 0 auto;
  }
  .checkin-row .time{font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);font-size:12px;}
  .empty{text-align:center;padding:20px 10px;color:var(--ink-soft);font-size:13px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="clock-wrap">
      <div class="clock-face" id="clockFace">
        <div class="hand hour" id="handHour"></div>
        <div class="hand minute" id="handMinute"></div>
        <div class="hand second" id="handSecond"></div>
        <div class="clock-pin"></div>
      </div>
    </div>
    <h1>UB Cafe</h1>
    <div class="sub">Staff Check-In</div>
    <div class="now" id="nowLine"></div>
  </div>

  <div class="panel" id="checkinPanel">
    <div class="section-label">Tap Your Name</div>
    <div class="emp-grid" id="empGrid"><div class="emp-empty">Loading…</div></div>
    <button class="primary" id="checkinBtn" disabled>Check In</button>
    <div class="msg" id="checkinMsg"></div>
  </div>

  <div class="panel">
    <div class="section-label">Checked In Today</div>
    <div id="todayList"></div>
  </div>

</div>

<div class="stamp-overlay" id="stampOverlay">
  <div style="text-align:center;">
    <div class="stamp" id="stampEl">
      <div class="stamp-check">✓</div>
      <div class="stamp-title">CHECKED IN</div>
      <div class="stamp-name" id="stampName"></div>
      <div class="stamp-time" id="stampTime"></div>
    </div>
    <button class="stamp-dismiss" id="stampDismissBtn">Done</button>
  </div>
</div>

<script>
/* ---------------------------------------------------------------------
   Storage shim — identical to the main app, so this reads/writes the
   same shared data when hosted on the same site.
--------------------------------------------------------------------- */
const memoryStore = {};
const hasRealStorage = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function');

async function storageGet(key, shared){
  if(hasRealStorage){
    try{ const res = await window.storage.get(key, !!shared); return res ? res.value : null; }
    catch(e){ return null; }
  }
  try{ const v = window.localStorage.getItem(key); return v === null ? null : v; }
  catch(e){ return Object.prototype.hasOwnProperty.call(memoryStore, key) ? memoryStore[key] : null; }
}
async function storageSet(key, value, shared){
  if(hasRealStorage){
    try{ await window.storage.set(key, value, !!shared); return true; }
    catch(e){ return false; }
  }
  try{ window.localStorage.setItem(key, value); return true; }
  catch(e){ memoryStore[key] = value; return true; }
}

const $ = sel => document.querySelector(sel);
function $$(sel){ return Array.from(document.querySelectorAll(sel)); }
const EMPLOYEES_KEY = "ubcafe_employees";
const ATTENDANCE_KEY = "ubcafe_attendance";

function todayStr(){ return new Date().toISOString().slice(0,10); }
function nowTimeStr(){ return new Date().toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}); }
function initials(name){
  const parts = String(name||'').trim().split(/\s+/);
  return ((parts[0]?.[0]||'') + (parts[1]?.[0]||'')).toUpperCase() || '?';
}

let employees = [];
let attendance = []; // [{id, employeeId, employeeName, date, time, lat?, lng?}]
let selectedEmployeeId = null;

/* ---------------------------------------------------------------------
   Device identity — a random ID generated once and stored in this
   browser's own localStorage (deliberately NOT synced anywhere), so it
   stays stable for this specific phone/browser across visits. Used to
   lock each employee to the one device they first check in from,
   preventing someone from checking in on a coworker's behalf.
--------------------------------------------------------------------- */
const DEVICE_ID_KEY = 'ubcafe_device_id';
function getDeviceId(){
  try{
    let id = window.localStorage.getItem(DEVICE_ID_KEY);
    if(!id){
      id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('dev-' + Date.now() + '-' + Math.random().toString(36).slice(2));
      window.localStorage.setItem(DEVICE_ID_KEY, id);
    }
    return id;
  }catch(e){
    return null; // localStorage unavailable — device locking just won't apply this session
  }
}

async function loadData(){
  const eVal = await storageGet(EMPLOYEES_KEY, true);
  try{ employees = eVal ? JSON.parse(eVal) : []; }catch(e){ employees = []; }
  const aVal = await storageGet(ATTENDANCE_KEY, true);
  try{ attendance = aVal ? JSON.parse(aVal) : []; }catch(e){ attendance = []; }
}
async function saveAttendance(){
  await storageSet(ATTENDANCE_KEY, JSON.stringify(attendance), true);
}
async function saveEmployees(){
  await storageSet(EMPLOYEES_KEY, JSON.stringify(employees), true);
}
function alreadyCheckedInToday(employeeId){
  return attendance.find(a => a.employeeId===employeeId && a.date===todayStr());
}

function renderEmployeeGrid(){
  const grid = $('#empGrid');
  const active = employees.filter(e=>e.status==='Active');
  if(active.length===0){
    grid.innerHTML = '<div class="emp-empty">No active employees on file.</div>';
    return;
  }
  grid.innerHTML = active.map(e=>{
    const done = !!alreadyCheckedInToday(e.id);
    const sel = e.id===selectedEmployeeId;
    return `
      <div class="emp-card ${sel?'selected':''} ${done?'done':''}" data-id="${e.id}">
        <div class="emp-avatar">${initials(e.fullName)}</div>
        <div class="emp-name">${e.fullName}</div>
        ${done ? '<div class="emp-done-tag">✓ Done</div>' : ''}
      </div>`;
  }).join('');
  $$('.emp-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      selectedEmployeeId = Number(card.dataset.id);
      renderEmployeeGrid();
      updateCheckinButtonState();
    });
  });
}

function updateCheckinButtonState(){
  const btn = $('#checkinBtn');
  const msg = $('#checkinMsg');
  msg.className = 'msg';
  if(!selectedEmployeeId){ btn.disabled = true; btn.textContent = 'Check In'; btn.classList.remove('checked-in'); return; }
  const existing = alreadyCheckedInToday(selectedEmployeeId);
  if(existing){
    btn.disabled = true;
    btn.textContent = `✓ Checked in at ${existing.time}`;
    btn.classList.add('checked-in');
  }else{
    btn.disabled = false;
    btn.textContent = 'Check In';
    btn.classList.remove('checked-in');
  }
}

function renderTodayList(){
  const el = $('#todayList');
  const todays = attendance.filter(a=>a.date===todayStr()).sort((a,b)=> a.time < b.time ? -1 : 1);
  if(todays.length===0){
    el.innerHTML = '<div class="empty">No one has checked in yet today.</div>';
    return;
  }
  el.innerHTML = todays.map(a=>`
    <div class="checkin-row">
      <span class="ci-left"><span class="mini-avatar">${initials(a.employeeName)}</span>${a.employeeName}</span>
      <span class="time">${a.time}</span>
    </div>`).join('');
}

function getLocationPromise(){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      err => { console.error('Location capture failed:', err); resolve(null); },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });
}

function showStamp(name, time){
  $('#stampName').textContent = name;
  $('#stampTime').textContent = time;
  const stamp = $('#stampEl');
  stamp.style.animation = 'none';
  void stamp.offsetWidth; // restart the animation if shown twice in a row
  stamp.style.animation = '';
  $('#stampOverlay').classList.add('show');
}
$('#stampDismissBtn').addEventListener('click', ()=> $('#stampOverlay').classList.remove('show'));
$('#stampOverlay').addEventListener('click', (e)=>{ if(e.target.id==='stampOverlay') $('#stampOverlay').classList.remove('show'); });

$('#checkinBtn').addEventListener('click', async ()=>{
  const emp = employees.find(e=>e.id===selectedEmployeeId);
  const msg = $('#checkinMsg');
  if(!emp) return;
  if(alreadyCheckedInToday(emp.id)){
    msg.textContent = "You're already checked in for today.";
    msg.className = 'msg show err';
    return;
  }
  const deviceId = getDeviceId();
  if(emp.registeredDeviceId && deviceId && emp.registeredDeviceId !== deviceId){
    msg.textContent = `${emp.fullName} is already registered to a different phone. If this is a new phone, ask a manager to reset it in the app.`;
    msg.className = 'msg show err';
    return;
  }
  const btn = $('#checkinBtn');
  btn.disabled = true;
  btn.textContent = 'Getting your location…';
  try{
    const location = await getLocationPromise();
    btn.textContent = 'Checking in…';
    const time = nowTimeStr();
    attendance.push({
      id: Date.now(),
      employeeId: emp.id,
      employeeName: emp.fullName,
      date: todayStr(),
      time,
      ...(location ? { lat: location.lat, lng: location.lng } : {})
    });
    await saveAttendance();
    if(!emp.registeredDeviceId && deviceId){
      emp.registeredDeviceId = deviceId;
      await saveEmployees();
    }
    showStamp(emp.fullName, time);
    msg.className = 'msg';
    renderEmployeeGrid();
    updateCheckinButtonState();
    renderTodayList();
  }catch(e){
    msg.textContent = "Something went wrong: " + e.message;
    msg.className = 'msg show err';
    btn.disabled = false;
    btn.textContent = 'Check In';
  }
});

/* ---------------------------------------------------------------------
   Live analog clock — the signature visual element
--------------------------------------------------------------------- */
function buildTicks(){
  const face = $('#clockFace');
  for(let i=0;i<12;i++){
    const tick = document.createElement('div');
    tick.className = 'tick';
    const long = i % 3 === 0;
    tick.style.width = long ? '2.5px' : '1.5px';
    tick.style.height = long ? '9px' : '6px';
    tick.style.left = '50%';
    tick.style.top = '4px';
    tick.style.transformOrigin = `50% ${132/2 - 4}px`;
    tick.style.transform = `translateX(-50%) rotate(${i*30}deg)`;
    face.appendChild(tick);
  }
}
function updateClock(){
  const now = new Date();
  const h = now.getHours() % 12, m = now.getMinutes(), s = now.getSeconds();
  $('#handHour').style.transform = `translateX(-50%) rotate(${h*30 + m*0.5}deg)`;
  $('#handMinute').style.transform = `translateX(-50%) rotate(${m*6 + s*0.1}deg)`;
  $('#handSecond').style.transform = `translateX(-50%) rotate(${s*6}deg)`;
  $('#nowLine').textContent = now.toLocaleString('en-US', { weekday:'long', month:'short', day:'numeric' });
}

(async function init(){
  buildTicks();
  updateClock();
  setInterval(updateClock, 1000);
  await loadData();
  renderEmployeeGrid();
  renderTodayList();
})();
</script>
</body>
</html>
