<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UB Cafe — Staff Check-In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F2E4;
    --paper-line:#E4D9BC;
    --ink:#1E2A24;
    --ink-soft:#4B5A50;
    --brass:#B8892B;
    --brass-dark:#8C6A20;
    --credit:#2C6E63;
    --debit:#A63D2F;
    --card:#FFFDF7;
    --danger-bg:#F6E3DF;
    --ok-bg:#E1EEE9;
    --shadow: 0 1px 2px rgba(30,42,36,0.06), 0 4px 14px rgba(30,42,36,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}
  .wrap{max-width:480px;margin:0 auto;padding:32px 18px 60px;}

  .header{text-align:center;margin-bottom:22px;}
  .crest{
    width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;
    align-items:center;justify-content:center;margin:0 auto 10px;font-family:'Fraunces',serif;font-weight:700;font-size:18px;
  }
  .header h1{font-family:'Fraunces',serif;font-weight:700;font-size:24px;margin:0;}
  .header .sub{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  .header .now{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);margin-top:8px;}

  .panel{background:var(--card);border:1px solid var(--ink);border-radius:10px;padding:22px;box-shadow:var(--shadow);}
  .panel + .panel{margin-top:16px;}

  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
  select{
    font-family:'Inter',sans-serif;font-size:15px;padding:11px 12px;border:1px solid var(--paper-line);
    border-radius:7px;background:#fff;color:var(--ink);width:100%;box-sizing:border-box;
  }
  select:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:var(--brass);}

  button.primary{
    font-family:'Inter',sans-serif;font-weight:700;font-size:15px;background:var(--ink);color:var(--paper);
    border:none;padding:13px 20px;border-radius:8px;cursor:pointer;width:100%;
  }
  button.primary:disabled{background:#B7BDB8;cursor:not-allowed;}
  button.primary:hover:not(:disabled){background:#0f1913;}
  button.primary.checked-in{background:var(--credit);}

  .msg{font-size:13px;margin-top:10px;padding:9px 12px;border-radius:6px;display:none;text-align:center;}
  .msg.show{display:block;}
  .msg.err{background:var(--danger-bg);color:var(--debit);}
  .msg.ok{background:var(--ok-bg);color:var(--credit);}

  .status-banner{text-align:center;padding:14px;border-radius:9px;margin-bottom:16px;}
  .status-banner.in{background:var(--ok-bg);}
  .status-banner .sb-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
  .status-banner .sb-value{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:700;margin-top:2px;color:var(--credit);}

  .today-title{font-family:'Fraunces',serif;font-weight:600;font-size:15px;margin-bottom:10px;}
  .checkin-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--paper-line);font-size:13.5px;}
  .checkin-row:last-child{border-bottom:none;}
  .checkin-row .time{font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);}
  .empty{text-align:center;padding:20px 10px;color:var(--ink-soft);font-size:13px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="crest">UB</div>
    <h1>UB Cafe</h1>
    <div class="sub">Staff Check-In</div>
    <div class="now" id="nowLine"></div>
  </div>

  <div class="panel" id="checkinPanel">
    <div class="field">
      <label for="employeeSelect">Who are you?</label>
      <select id="employeeSelect"><option value="">Loading…</option></select>
    </div>
    <button class="primary" id="checkinBtn" disabled>Check In</button>
    <div class="msg" id="checkinMsg"></div>
  </div>

  <div class="panel">
    <div class="today-title">Checked In Today</div>
    <div id="todayList"></div>
  </div>

</div>

<script>
/* ---------------------------------------------------------------------
   Storage shim — identical to the main app, so this reads/writes the
   same shared data when hosted on the same site.
--------------------------------------------------------------------- */
const memoryStore = {};
const hasRealStorage = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function');

async function storageGet(key, shared){
  if(hasRealStorage){
    try{ const res = await window.storage.get(key, !!shared); return res ? res.value : null; }
    catch(e){ return null; }
  }
  try{ const v = window.localStorage.getItem(key); return v === null ? null : v; }
  catch(e){ return Object.prototype.hasOwnProperty.call(memoryStore, key) ? memoryStore[key] : null; }
}
async function storageSet(key, value, shared){
  if(hasRealStorage){
    try{ await window.storage.set(key, value, !!shared); return true; }
    catch(e){ return false; }
  }
  try{ window.localStorage.setItem(key, value); return true; }
  catch(e){ memoryStore[key] = value; return true; }
}

const $ = sel => document.querySelector(sel);
const EMPLOYEES_KEY = "ubcafe_employees";
const ATTENDANCE_KEY = "ubcafe_attendance";

function todayStr(){ return new Date().toISOString().slice(0,10); }
function nowTimeStr(){ return new Date().toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}); }

let employees = [];
let attendance = []; // [{id, employeeId, employeeName, date, time}]

async function loadData(){
  const eVal = await storageGet(EMPLOYEES_KEY, true);
  try{ employees = eVal ? JSON.parse(eVal) : []; }catch(e){ employees = []; }
  const aVal = await storageGet(ATTENDANCE_KEY, true);
  try{ attendance = aVal ? JSON.parse(aVal) : []; }catch(e){ attendance = []; }
}
async function saveAttendance(){
  await storageSet(ATTENDANCE_KEY, JSON.stringify(attendance), true);
}

function populateEmployeeSelect(){
  const sel = $('#employeeSelect');
  const active = employees.filter(e=>e.status==='Active');
  sel.innerHTML = active.length
    ? '<option value="">Select your name…</option>' + active.map(e=>`<option value="${e.id}">${e.fullName}</option>`).join('')
    : '<option value="">No active employees on file</option>';
}

function alreadyCheckedInToday(employeeId){
  return attendance.find(a => a.employeeId===employeeId && a.date===todayStr());
}

function updateCheckinButtonState(){
  const empId = Number($('#employeeSelect').value);
  const btn = $('#checkinBtn');
  const msg = $('#checkinMsg');
  msg.className = 'msg';
  if(!empId){ btn.disabled = true; btn.textContent = 'Check In'; btn.classList.remove('checked-in'); return; }
  const existing = alreadyCheckedInToday(empId);
  if(existing){
    btn.disabled = true;
    btn.textContent = `✓ Checked in at ${existing.time}`;
    btn.classList.add('checked-in');
  }else{
    btn.disabled = false;
    btn.textContent = 'Check In';
    btn.classList.remove('checked-in');
  }
}

function renderTodayList(){
  const el = $('#todayList');
  const todays = attendance.filter(a=>a.date===todayStr()).sort((a,b)=> a.time < b.time ? -1 : 1);
  if(todays.length===0){
    el.innerHTML = '<div class="empty">No one has checked in yet today.</div>';
    return;
  }
  el.innerHTML = todays.map(a=>`<div class="checkin-row"><span>${a.employeeName}</span><span class="time">${a.time}</span></div>`).join('');
}

$('#employeeSelect').addEventListener('change', updateCheckinButtonState);

function getLocationPromise(){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      err => { console.error('Location capture failed:', err); resolve(null); },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });
}

$('#checkinBtn').addEventListener('click', async ()=>{
  const empId = Number($('#employeeSelect').value);
  const emp = employees.find(e=>e.id===empId);
  const msg = $('#checkinMsg');
  if(!emp) return;
  if(alreadyCheckedInToday(empId)){
    msg.textContent = "You're already checked in for today.";
    msg.className = 'msg show err';
    return;
  }
  const btn = $('#checkinBtn');
  btn.disabled = true;
  btn.textContent = 'Getting your location…';
  try{
    const location = await getLocationPromise();
    btn.textContent = 'Checking in…';
    attendance.push({
      id: Date.now(),
      employeeId: empId,
      employeeName: emp.fullName,
      date: todayStr(),
      time: nowTimeStr(),
      ...(location ? { lat: location.lat, lng: location.lng } : {})
    });
    await saveAttendance();
    msg.textContent = location
      ? `You're checked in, ${emp.fullName}! Have a great shift.`
      : `You're checked in, ${emp.fullName}! (Location wasn't available — check-in still recorded.)`;
    msg.className = 'msg show ok';
    updateCheckinButtonState();
    renderTodayList();
  }catch(e){
    msg.textContent = "Something went wrong: " + e.message;
    msg.className = 'msg show err';
    btn.disabled = false;
    btn.textContent = 'Check In';
  }
});

function updateNowLine(){
  $('#nowLine').textContent = new Date().toLocaleString('en-US', { weekday:'long', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
}

(async function init(){
  updateNowLine();
  setInterval(updateNowLine, 30000);
  await loadData();
  populateEmployeeSelect();
  renderTodayList();
})();
</script>
</body>
</html>
