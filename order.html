<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UB Cafe — Order Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
<style>
  :root{
    --paper:#F7F2E4;
    --paper-line:#E4D9BC;
    --ink:#1E2A24;
    --ink-soft:#4B5A50;
    --brass:#B8892B;
    --brass-dark:#8C6A20;
    --debit:#A63D2F;
    --credit:#2C6E63;
    --card:#FFFDF7;
    --danger-bg:#F6E3DF;
    --ok-bg:#E1EEE9;
    --radius:10px;
    --shadow: 0 1px 2px rgba(30,42,36,0.06), 0 4px 14px rgba(30,42,36,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;color:var(--ink);font-family:'Inter',sans-serif;}
  body{
    background-image: repeating-linear-gradient(to bottom, transparent 0px, transparent 27px, var(--paper-line) 28px);
    background-color: var(--paper);
    min-height:100vh;
  }
  .app{max-width:980px;margin:0 auto;padding:28px 20px 60px;}

  /* ---------- Header ---------- */
  .masthead{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:22px;border-bottom:3px double var(--ink);padding-bottom:14px;}
  .masthead h1{font-family:'Fraunces',serif;font-weight:700;font-size:30px;margin:0;letter-spacing:-0.01em;}
  .masthead .sub{font-size:12.5px;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase;}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap;}
  .tab{
    font-family:'Inter',sans-serif;font-weight:600;font-size:15px;letter-spacing:.02em;
    padding:9px 16px;border:1px solid var(--ink);border-bottom:none;
    background:var(--paper);color:var(--ink-soft);cursor:pointer;
    border-radius:8px 8px 0 0;position:relative;top:1px;
  }
  .tab.active{background:var(--card);color:var(--ink);box-shadow: 0 -2px 0 var(--brass) inset;}
  .tab:hover:not(.active){color:var(--ink);}
  .panel{background:var(--card);border:1px solid var(--ink);border-radius:8px;padding:26px;box-shadow:var(--shadow);}
  .view{display:none;}
  .view.active{display:block;}
  .hr-view{display:none;}
  .hr-view.active{display:block;}
  .inv-view{display:none;}
  .inv-view.active{display:block;}
  .vnd-view{display:none;}
  .vnd-view.active{display:block;}
  .pos-view{display:none;}
  .pos-view.active{display:block;}

  /* ---------- Point of Sale ---------- */
  .pos-layout{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start;}
  .pos-category-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .pos-scan-bar{display:flex;gap:8px;margin-bottom:8px;}
  .pos-scan-bar input{flex:1;font-family:'IBM Plex Mono',monospace;}
  .pos-scan-bar button{white-space:nowrap;}
  .pos-cat-btn{
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;
    border:1px solid var(--paper-line);background:var(--card);color:var(--ink-soft);cursor:pointer;
  }
  .pos-cat-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .pos-item-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(120px,1fr));gap:10px;}
  .pos-item-btn{
    background:var(--card);border:1px solid var(--paper-line);border-radius:10px;padding:14px 10px;
    text-align:center;cursor:pointer;transition:transform .05s ease;
  }
  .pos-item-btn:hover{border-color:var(--brass);background:#FBF6EA;}
  .pos-item-btn:active{transform:scale(0.96);}
  .pos-item-btn .pi-name{font-weight:600;font-size:13px;margin-bottom:4px;}
  .pos-item-btn .pi-price{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--brass-dark);}
  .pos-item-btn .pi-stock{font-size:10.5px;margin-top:3px;color:var(--ink-soft);}
  .pos-item-btn .pi-stock.low{color:var(--debit);font-weight:600;}
  .pos-item-btn.out-of-stock{opacity:.45;cursor:not-allowed;}
  .pos-item-btn.out-of-stock:hover{border-color:var(--paper-line);background:var(--card);}
  .stock-row-low{background:var(--danger-bg) !important;}
  .low-stock-banner{
    background:var(--danger-bg);border:1px solid var(--debit);border-radius:8px;padding:10px 14px;
    margin-bottom:12px;font-size:12.5px;color:var(--debit);cursor:pointer;display:flex;align-items:center;gap:8px;
  }
  .low-stock-banner:hover{background:#F3D6D0;}

  .wp-request-card{
    background:#FBF6EA;border:1px solid var(--brass);border-radius:8px;padding:10px 12px;
    margin-bottom:8px;font-size:12.5px;
  }
  .wp-request-card .wpr-top{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:3px;}
  .wp-request-card .wpr-items{color:var(--ink-soft);margin-bottom:6px;}
  .wp-request-card .wpr-actions{display:flex;gap:8px;}
  .wp-request-card .wpr-actions button{font-size:12px;padding:5px 10px;}

  .pos-cart-panel{
    background:#FBF6EA;border:1px solid var(--paper-line);border-radius:10px;padding:16px;
    position:sticky;top:12px;
  }
  .pos-cart-title{font-family:'Fraunces',serif;font-weight:600;font-size:15px;margin-bottom:10px;}
  .pos-cart-list{min-height:40px;max-height:220px;overflow-y:auto;margin-bottom:8px;}
  .pos-cart-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--paper-line);font-size:12.5px;}
  .pos-cart-row .pc-name{flex:1;}
  .pos-cart-row .pc-qty-controls{display:flex;align-items:center;gap:4px;}
  .pos-cart-row .pc-qty-btn{
    width:20px;height:20px;border-radius:5px;border:1px solid var(--paper-line);background:#fff;
    cursor:pointer;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;
  }
  .pos-cart-row .pc-total{font-family:'IBM Plex Mono',monospace;width:70px;text-align:right;}
  .pos-cart-row .pc-remove{background:none;border:none;color:var(--debit);cursor:pointer;font-size:14px;}
  .pos-cart-total{display:flex;justify-content:space-between;font-weight:700;font-size:16px;padding-top:8px;border-top:2px double var(--ink);}
  .pos-recent-title{font-family:'Fraunces',serif;font-weight:600;font-size:13px;margin:18px 0 8px;border-top:1px solid var(--paper-line);padding-top:14px;}
  .pos-recent-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;color:var(--ink-soft);}

  @media (max-width:800px){
    .pos-layout{grid-template-columns:1fr;}
    .pos-cart-panel{position:static;}
  }
  .status-pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;}
  .status-pill.paid{background:var(--ok-bg);color:var(--credit);}
  .status-pill.partial{background:#FBF0D9;color:var(--brass-dark);}
  .status-pill.unpaid{background:var(--danger-bg);color:var(--debit);}
  .status-pill.overdue{background:var(--debit);color:#fff;}

  /* ---------- Printable Invoice Document (matches uploaded template) ---------- */
  .invoice-doc-wrap{max-width:640px;width:100%;max-height:88vh;overflow-y:auto;}
  .invoice-doc{background:#fff;color:#1a1a1a;font-family:'Calibri','Inter',sans-serif;padding:8px 4px;}
  .invoice-doc.receipt-mode{padding:0;}
  .invoice-doc .idoc-title{font-family:'Calibri','Inter',sans-serif;font-size:42px;font-weight:400;margin:0 0 18px;color:#1a1a1a;}
  .invoice-doc .idoc-toprow{display:flex;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .invoice-doc .idoc-col{flex:1;min-width:150px;}
  .invoice-doc .idoc-label{font-weight:700;font-size:12px;margin-bottom:3px;}
  .invoice-doc .idoc-line{font-size:12px;line-height:1.5;}
  .invoice-doc .idoc-meta-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px;gap:10px;}
  .invoice-doc .idoc-meta-row .idoc-meta-label{font-weight:700;}
  .invoice-doc table{width:100%;border-collapse:collapse;margin-bottom:6px;}
  .invoice-doc thead th{
    background:#073673;color:#fff;font-size:12px;font-weight:700;text-align:left;padding:8px 8px;
  }
  .invoice-doc thead th.idoc-num{text-align:right;}
  .invoice-doc tbody td{padding:7px 8px;font-size:12px;border-bottom:1px solid #E6E6E6;}
  .invoice-doc tbody td.idoc-num{text-align:right;font-family:'IBM Plex Mono',monospace;}
  .invoice-doc .idoc-totals{margin:10px 0 26px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  .invoice-doc .idoc-totals-row{display:flex;justify-content:space-between;width:220px;font-size:12.5px;}
  .invoice-doc .idoc-totals-row.idoc-grand{
    background:#FFFF99;font-weight:700;font-size:14px;padding:6px 8px;width:220px;box-sizing:border-box;
  }
  .invoice-doc .idoc-bottom{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:1px solid #E6E6E6;padding-top:16px;}
  .invoice-doc .idoc-bottom-col{flex:1;min-width:180px;}
  .invoice-doc .idoc-bottom-title{font-weight:700;font-size:15px;margin-bottom:8px;}
  .invoice-doc .idoc-bottom-line{font-size:12px;line-height:1.7;}
  .invoice-doc .idoc-bottom-line b{font-weight:700;}

  /* ---------- Printable POS Receipt (distinct from the formal invoice) ---------- */
  .receipt-doc{
    background:#fff;color:#1a1a1a;font-family:'IBM Plex Mono',monospace;font-size:12.5px;
    max-width:320px;margin:0 auto;padding:18px 16px;
  }
  .receipt-doc .rc-header{text-align:center;margin-bottom:10px;}
  .receipt-doc .rc-crest{
    width:44px;height:44px;border-radius:50%;background:#1E2A24;color:#fff;display:flex;
    align-items:center;justify-content:center;margin:0 auto 8px;font-family:'Fraunces',serif;
    font-weight:700;font-size:15px;
  }
  .receipt-doc .rc-bizname{font-weight:700;font-size:14px;letter-spacing:.02em;}
  .receipt-doc .rc-addr{font-size:10.5px;color:#555;margin-top:2px;line-height:1.5;}
  .receipt-doc .rc-divider{border-top:1px dashed #999;margin:10px 0;}
  .receipt-doc .rc-meta-row{display:flex;justify-content:space-between;font-size:11.5px;padding:1px 0;}
  .receipt-doc .rc-items{margin:2px 0;}
  .receipt-doc .rc-item{padding:6px 0;border-bottom:1px dotted #ddd;}
  .receipt-doc .rc-item:last-child{border-bottom:none;}
  .receipt-doc .rc-item-top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;}
  .receipt-doc .rc-item-sub{font-size:10.5px;color:#666;margin-top:1px;}
  .receipt-doc .rc-total-row{display:flex;justify-content:space-between;font-size:16px;font-weight:700;padding:6px 0 2px;}
  .receipt-doc .rc-total-label{font-size:11px;font-weight:400;text-transform:uppercase;letter-spacing:.06em;color:#555;}
  .receipt-doc .rc-payment-row{display:flex;justify-content:space-between;font-size:11.5px;margin-top:4px;color:#444;}
  .receipt-doc .rc-badge{
    display:block;width:fit-content;margin:10px auto 0;border:2px solid #2C6E63;color:#2C6E63;
    font-weight:700;font-size:12px;letter-spacing:.15em;padding:3px 12px;border-radius:4px;
  }
  .receipt-doc .rc-badge.due{border-color:#A63D2F;color:#A63D2F;}
  .receipt-doc .rc-footer{text-align:center;margin-top:14px;font-size:11px;color:#555;line-height:1.6;}
  .receipt-doc .rc-footer .rc-thanks{font-weight:600;color:#1a1a1a;font-size:12px;margin-bottom:2px;}
  .receipt-doc .rc-snip{text-align:center;color:#bbb;font-size:13px;margin-top:16px;letter-spacing:.3em;}
  .invoice-doc .idoc-paid-badge{
    display:inline-block;border:3px solid #2C6E63;color:#2C6E63;font-weight:700;font-size:15px;
    letter-spacing:.15em;padding:4px 14px;border-radius:6px;transform:rotate(-6deg);
    position:absolute;top:14px;right:0;
  }
  .invoice-doc .idoc-toprow{position:relative;}

  /* ---------- Voucher (New Entry) ---------- */
  .voucher{
    position:relative;background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);
    padding:24px 24px 20px;margin-bottom:18px;
  }
  .voucher::before{
    content:"";position:absolute;top:-1px;left:0;right:0;height:0;
    border-top:2px dashed var(--paper-line);
  }
  .voucher-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .field{flex:1;min-width:160px;display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);}
  input[type=text], input[type=date], input[type=number]{
    font-family:'Inter',sans-serif;font-size:14px;padding:9px 10px;border:1px solid var(--paper-line);
    border-radius:6px;background:#FFFFFF;color:var(--ink);
  }
  select{
    font-family:'Inter',sans-serif;font-size:15.5px;padding:9px 10px;border:1px solid var(--paper-line);
    border-radius:6px;background:#FFFFFF;color:var(--ink);
  }
  input[type=number]{font-family:'IBM Plex Mono',monospace;text-align:right;}
  input:focus, select:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:var(--brass);}

  .lines-head, .line-row{
    display:grid;grid-template-columns: 2.4fr 1fr 1fr 32px; gap:10px; align-items:center;
  }
  .lines-head{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);padding:0 2px 6px;border-bottom:1px solid var(--paper-line);margin-bottom:8px;}
  .line-row{padding:5px 2px;}
  .line-row + .line-row{border-top:1px dashed var(--paper-line);}
  .remove-line{background:none;border:none;color:var(--debit);font-size:18px;cursor:pointer;line-height:1;padding:4px;}
  .remove-line:hover{color:#7a2a20;}
  .add-line{
    margin-top:10px;background:none;border:1px dashed var(--brass-dark);color:var(--brass-dark);
    font-weight:600;font-size:13px;padding:8px 14px;border-radius:6px;cursor:pointer;
  }
  .add-line:hover{background:#FBF3E2;}

  .voucher-footer{display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:2px double var(--paper-line);flex-wrap:wrap;gap:12px;}
  .totals{font-family:'IBM Plex Mono',monospace;font-size:13.5px;display:flex;gap:18px;}
  .totals span b{font-weight:600;}
  .balance-badge{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:999px;
  }
  .balance-badge.ok{background:var(--ok-bg);color:var(--credit);}
  .balance-badge.bad{background:var(--danger-bg);color:var(--debit);}

  button.primary{
    font-family:'Inter',sans-serif;font-weight:700;font-size:14px;letter-spacing:.02em;
    background:var(--ink);color:var(--paper);border:none;padding:11px 22px;border-radius:7px;cursor:pointer;
  }
  button.primary:disabled{background:#B7BDB8;cursor:not-allowed;}
  button.primary:not(:disabled):hover{background:#0f1913;}
  button.secondary{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;background:transparent;color:var(--ink-soft);
    border:1px solid var(--paper-line);padding:8px 14px;border-radius:7px;cursor:pointer;
  }
  button.secondary:hover{border-color:var(--ink-soft);color:var(--ink);}

  .msg{font-size:12.5px;margin-top:10px;padding:9px 12px;border-radius:6px;display:none;}
  .msg.show{display:block;}
  .msg.ok{background:var(--ok-bg);color:var(--credit);}
  .msg.err{background:var(--danger-bg);color:var(--debit);}

  /* ---------- Tables ---------- */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .actions-cell{display:flex;flex-wrap:wrap;gap:5px;}
  .actions-cell .del-entry{padding:5px 9px;font-size:11.5px;white-space:nowrap;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);padding:8px 10px;border-bottom:2px solid var(--ink);}
  td{padding:9px 10px;border-bottom:1px solid var(--paper-line);vertical-align:top;}
  td.num, th.num{text-align:right;font-family:'IBM Plex Mono',monospace;}
  tr.entry-head td{background:#FBF6EA;font-weight:600;}
  .entry-desc{color:var(--ink-soft);font-weight:400;}
  .del-entry{background:none;border:none;color:var(--debit);cursor:pointer;font-size:12px;font-weight:600;}
  .del-entry:hover{text-decoration:underline;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .toolbar h2{font-family:'Fraunces',serif;font-size:20px;margin:0;font-weight:600;}
  .actions{display:flex;gap:8px;}

  .empty{padding:40px 10px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

  .ledger-balance.debit{color:var(--debit);}
  .ledger-balance.credit{color:var(--credit);}

  .tb-total-row td{border-top:2px double var(--ink);font-weight:700;}
  .tb-ok{color:var(--credit);}
  .tb-bad{color:var(--debit);}

  /* ---------- Period filter ---------- */
  .period-bar{
    display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;
    background:#FBF6EA;border:1px solid var(--paper-line);border-radius:8px;
    padding:12px 14px;margin-bottom:18px;
  }
  .period-bar .field{flex:0 0 auto;min-width:140px;}
  .period-bar .hint{font-size:11.5px;color:var(--ink-soft);margin-left:auto;align-self:center;}

  /* ---------- Search boxes ---------- */
  .search-box{position:relative;margin-bottom:14px;max-width:340px;}
  .search-box input{
    width:100%;box-sizing:border-box;padding:9px 12px 9px 32px;border:1px solid var(--paper-line);
    border-radius:7px;font-family:'Inter',sans-serif;font-size:13.5px;background:#fff;
  }
  .search-box input:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:var(--brass);}
  .search-box::before{
    content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.6;pointer-events:none;
  }

  /* ---------- Global search ---------- */
  .global-search-wrap{position:relative;margin-bottom:18px;}
  .global-search-wrap input{
    width:100%;box-sizing:border-box;padding:12px 16px;border:1px solid var(--ink);border-radius:9px;
    font-family:'Inter',sans-serif;font-size:14px;background:var(--card);box-shadow:var(--shadow);
  }
  .global-search-wrap input:focus{outline:2px solid var(--brass);outline-offset:1px;}
  .global-search-results{
    display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:60;
    background:var(--card);border:1px solid var(--ink);border-radius:9px;box-shadow:var(--shadow);
    max-height:420px;overflow-y:auto;padding:6px 0;
  }
  .global-search-results.show{display:block;}
  .gsr-category{
    font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--brass-dark);
    padding:8px 14px 4px;
  }
  .gsr-item{
    display:flex;justify-content:space-between;gap:10px;padding:8px 14px;cursor:pointer;font-size:13px;
  }
  .gsr-item:hover{background:#FBF6EA;}
  .gsr-item .gsr-sub{color:var(--ink-soft);font-size:11.5px;}
  .gsr-empty{padding:16px;text-align:center;color:var(--ink-soft);font-size:13px;}

  /* ---------- Financial statements ---------- */
  .stmt{max-width:520px;}
  .stmt-section-title{
    font-family:'Fraunces',serif;font-size:14.5px;font-weight:600;color:var(--ink);
    margin:18px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--paper-line);
  }
  .stmt-section-title:first-child{margin-top:0;}
  .stmt-row{display:flex;justify-content:space-between;padding:4px 2px;font-size:13.5px;}
  .stmt-row .amt{font-family:'IBM Plex Mono',monospace;}
  .stmt-subtotal{display:flex;justify-content:space-between;padding:7px 2px;font-size:13.5px;font-weight:600;border-top:1px solid var(--paper-line);margin-top:4px;}
  .stmt-subtotal .amt{font-family:'IBM Plex Mono',monospace;}
  .stmt-total{
    display:flex;justify-content:space-between;padding:10px 2px;font-size:15px;font-weight:700;
    border-top:2px double var(--ink);margin-top:8px;
  }
  .stmt-total .amt{font-family:'IBM Plex Mono',monospace;}
  .stmt-total.net-positive .amt{color:var(--credit);}
  .stmt-total.net-negative .amt{color:var(--debit);}
  .check-line{margin-top:16px;font-size:12.5px;padding:9px 12px;border-radius:6px;}
  .check-line.tb-ok{background:var(--ok-bg);}
  .check-line.tb-bad{background:var(--danger-bg);}

  /* ---------- Screens ---------- */
  .screen{display:none;}
  .screen.active{display:block;}

  /* ---------- Login ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{
    width:100%;max-width:360px;background:var(--card);border:1px solid var(--ink);

  .login-crest{
    width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--paper);

  /* ---------- Welcome / Front page ---------- */
  .topbar-right{display:flex;align-items:center;gap:12px;}

  /* ---------- Sidebar layout ---------- */
  .app-shell{display:flex;min-height:100vh;align-items:stretch;}
  .sidebar{
    width:250px;flex:0 0 250px;background:#FBF6EA;border-right:1px solid var(--paper-line);

  .sidebar-footer{padding:12px 16px 18px;border-top:1px solid var(--paper-line);margin-top:auto;}

  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(30,42,36,.4);z-index:39;}
  .sidebar-overlay.show{display:block;}

  .app-main{flex:1;min-width:0;padding:24px 28px;}
  .mobile-topbar{display:none;align-items:center;gap:12px;margin-bottom:16px;}
  .mobile-topbar button{background:none;border:1px solid var(--paper-line);border-radius:7px;font-size:18px;padding:4px 10px;cursor:pointer;}
  .mobile-topbar-title{font-family:'Fraunces',serif;font-weight:700;font-size:17px;}

  @media (max-width:880px){
    .sidebar{
      position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s ease;
      box-shadow:0 0 24px rgba(0,0,0,.15);
    }
    .sidebar.open{transform:translateX(0);}
    .sidebar-close-btn{display:block;}
    .mobile-topbar{display:flex;}
    .app-main{padding:16px 14px;}

  .front-panel{max-width:760px;margin:0 auto;}

  .front-hero{position:relative;text-align:center;padding:10px 10px 22px;overflow:hidden;}
  .front-hero-pattern{
    position:absolute;inset:0;pointer-events:none;opacity:.55;
    background-image:
      radial-gradient(circle at 6px 6px, var(--paper-line) 1.4px, transparent 1.6px);
    background-size:26px 26px;
    -webkit-mask-image:linear-gradient(to bottom, black, transparent 85%);
    mask-image:linear-gradient(to bottom, black, transparent 85%);
  }
  .front-stamp{
    position:absolute;top:0;right:6px;color:var(--brass);opacity:.55;
    transform:rotate(8deg);
  }
  .front-hero-icon{
    position:relative;display:inline-flex;align-items:center;justify-content:center;
    width:78px;height:78px;border-radius:50%;background:#FBF6EA;border:1px solid var(--paper-line);
    color:var(--brass-dark);margin-bottom:12px;
  }
  .front-date{position:relative;font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;}
  .front-heading{position:relative;font-family:'Fraunces',serif;font-size:28px;margin:4px 0 2px;}
  .front-tag{position:relative;color:var(--ink-soft);font-size:14px;margin:0;}
  .front-rule{position:relative;margin-top:16px;color:var(--brass);font-size:15px;letter-spacing:.4em;}
  .front-rule span{display:inline-block;transform:scaleX(1.6);}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(170px,1fr));gap:14px;margin-bottom:26px;}
  .stat-card{
    position:relative;background:#FBF6EA;border:1px solid var(--paper-line);border-radius:10px;
    padding:16px 16px 16px 46px;overflow:hidden;

  .stat-card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brass);

  .stat-card.stat-debit::before{background:var(--debit);}

  .stat-card .stat-icon{
    position:absolute;left:12px;top:14px;width:20px;height:20px;color:var(--brass-dark);opacity:.8;
  }
  .stat-card .label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:6px;}
  .stat-card .value{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;}
  .stat-card .value.debit{color:var(--debit);}
  .stat-card .value.credit{color:var(--credit);}
  .front-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

  /* ---------- Letterhead (professional report header) ---------- */
  .letterhead{
    display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;
    border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:20px;
  }
  .letterhead .lh-name{font-family:'Fraunces',serif;font-weight:700;font-size:19px;}
  .letterhead .lh-addr{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .letterhead .lh-report{text-align:right;}
  .letterhead .lh-report .lh-title{font-weight:700;font-size:14px;}
  .letterhead .lh-report .lh-period{font-size:11.5px;color:var(--ink-soft);}
  .letterhead .lh-report .lh-gen{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}

  /* ---------- Modal (change login) ---------- */
  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(30,42,36,0.45);z-index:50;
    align-items:center;justify-content:center;padding:20px;
  }
  .modal-overlay.active{display:flex;}
  .modal-card{background:var(--card);border-radius:12px;padding:26px;max-width:340px;width:100%;box-shadow:var(--shadow);}
  .modal-card h3{font-family:'Fraunces',serif;margin:0 0 16px;font-size:18px;}
  .modal-card .field{margin-bottom:12px;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}

  /* ---------- Print ---------- */
  @media print{
    body{background:white;}
    .screen{display:none !important;}
    .screen.printing{display:block !important;}
    .masthead, .tabs, .toolbar .actions, .period-bar, .voucher, .front-actions,
    .topbar-right, .modal-overlay, .sidebar, .sidebar-overlay, .mobile-topbar,
    .global-search-wrap{ display:none !important; }
    .app-shell{display:block !important;}
    .app-main{padding:0 !important;}
    .panel{border:none;box-shadow:none;padding:0;}
    .view{display:none !important;}
    .view.print-active{display:block !important;}
    .letterhead{display:flex !important;}

    body.printing-invoice .screen{display:none !important;}
    body.printing-invoice #invoicePrintModal{
      display:flex !important;position:static;background:none;padding:0;
    }
    body.printing-invoice #invoicePrintModal .modal-card{
      box-shadow:none;max-width:none;max-height:none;padding:0;
    }
    body.printing-invoice .no-print{display:none !important;}
  }

  @media (max-width:640px){
    .lines-head, .line-row{grid-template-columns: 1.6fr .8fr .8fr 26px; gap:6px;}
    .voucher{padding:18px 14px;}
    .panel{padding:16px;}
  }
</style>
</style>
</head>
<body>

<div class="screen active" id="screen-customer-order">
  <div class="app" style="max-width:760px;">
    <div class="masthead">
      <div>
        <h1>UB Cafe</h1>
        <div class="sub">Order With Us</div>
      </div>
    </div>

    <div id="coOrderForm">
      <div class="pos-category-bar" id="coCategoryBar"></div>
      <div class="pos-item-grid" id="coItemGrid"></div>

      <div class="pos-cart-panel" style="margin-top:20px;position:static;">
        <div class="pos-cart-title">Your Order</div>
        <div class="pos-cart-list" id="coCartList"></div>

        <div class="field" style="margin-top:0;">
          <label for="coCustomerSelect">Who's ordering?</label>
          <input type="text" id="coCustomerSearch" placeholder="Search your name or phone…" style="margin-bottom:6px;">
          <select id="coCustomerSelect"></select>
        </div>

        <div class="voucher-row" id="coNewCustomerFields" style="margin-bottom:0;display:none;">
          <div class="field">
            <label for="coNewCustName">Your Name</label>
            <input type="text" id="coNewCustName" placeholder="e.g. Ahmed">
          </div>
          <div class="field">
            <label for="coNewCustPhone">Phone (optional)</label>
            <input type="text" id="coNewCustPhone" placeholder="e.g. 0634449111">
          </div>
        </div>

        <div class="field" style="margin-top:10px;">
          <label for="coNote">Table / Note (optional)</label>
          <input type="text" id="coNote" placeholder="e.g. Table 5">
        </div>

        <div class="pos-cart-total">
          <span>Total</span>
          <span id="coCartTotal">0 Sl.sh</span>
        </div>

        <div class="msg" id="coMsg"></div>
        <button class="primary" id="coSubmitBtn" style="width:100%;margin-top:10px;" disabled>Send Order to Counter</button>

        <div class="login-hint" id="coPaymentInfo" style="margin-top:14px;line-height:1.7;"></div>
        <div class="login-hint" style="margin-top:4px;">Payment is taken at the counter, or send it ahead using one of the accounts above and show your receipt when you collect your order.</div>
        <div class="login-hint" id="coSyncStatusLine" style="margin-top:10px;"></div>
      </div>
    </div>

    <div id="coConfirmation" style="display:none;text-align:center;padding:60px 20px;">
      <div style="font-size:40px;margin-bottom:10px;">✅</div>
      <h2 style="font-family:'Fraunces',serif;margin:0 0 6px;">Order Sent!</h2>
      <p id="coConfirmationText" style="color:var(--ink-soft);"></p>
      <button class="secondary" id="coNewOrderBtn" style="margin-top:16px;">Place Another Order</button>
    </div>
  </div>
</div>

<script>
/* ---------------------------------------------------------------------
   UB Cafe — Customer Ordering (standalone page)
   Talks to the exact same shared storage keys as the staff app
   (index.html), so orders submitted here show up in its POS Pending
   Orders panel. Keep the key names below in sync with index.html if
   you ever change them there.
--------------------------------------------------------------------- */
const memoryStore = {};
const hasRealStorage = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function');

async function storageGet(key, shared){
  if(hasRealStorage){
    try{
      const res = await window.storage.get(key, !!shared);
      return res ? res.value : null;
    }catch(e){ return null; }
  }
  try{
    const v = window.localStorage.getItem(key);
    return v === null ? null : v;
  }catch(e){
    return Object.prototype.hasOwnProperty.call(memoryStore, key) ? memoryStore[key] : null;
  }
}
async function storageSet(key, value, shared){
  if(hasRealStorage){
    try{
      await window.storage.set(key, value, !!shared);
      return true;
    }catch(e){ return false; }
  }
  try{
    window.localStorage.setItem(key, value);
    return true;
  }catch(e){
    memoryStore[key] = value;
    return true;
  }
}

const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
const fmt = n => (Math.round(n*100)/100).toLocaleString('en-US');

const POS_ITEMS_KEY = "ubcafe_pos_items";
let posItems = [];
async function loadPosItems(){
  const val = await storageGet(POS_ITEMS_KEY, true);
  try{ posItems = val ? JSON.parse(val) : []; }catch(e){ posItems = []; }
}

const CUSTOMERS_KEY = "ubcafe_customers";
let customers = [];
async function loadCustomers(){
  const val = await storageGet(CUSTOMERS_KEY, true);
  try{ customers = val ? JSON.parse(val) : []; }catch(e){ customers = []; }
}
async function saveCustomers(){ await storageSet(CUSTOMERS_KEY, JSON.stringify(customers), true); }

const SALE_REQUESTS_KEY = "ubcafe_sale_requests";
let saleRequests = [];
async function loadSaleRequests(){
  const val = await storageGet(SALE_REQUESTS_KEY, true);
  try{ saleRequests = val ? JSON.parse(val) : []; }catch(e){ saleRequests = []; }
}
async function saveSaleRequests(){
  await storageSet(SALE_REQUESTS_KEY, JSON.stringify(saleRequests), true);
}

/* Keep these in sync with PAYMENT_INFO in index.html */
const PAYMENT_INFO = {
  bankName: "Darasalam",
  accountNumber: "61341021",
  zaad: "634449111",
  edahab: "654449111",
  waafi: "252634449111",
  dahabplus: "252654449111",
  premierWallet: "252634449111"
};

let coCart = [];
let coActiveCategory = 'All';

function renderCoCategoryBar(){
  const cats = ['All', ...new Set(posItems.map(it=>it.category||'General'))];
  $('#coCategoryBar').innerHTML = cats.map(c=>
    `<button class="pos-cat-btn ${c===coActiveCategory?'active':''}" data-cat="${c}">${c}</button>`
  ).join('');
  $$('#coCategoryBar .pos-cat-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      coActiveCategory = btn.dataset.cat;
      renderCoCategoryBar();
      renderCoItemGrid();
    });
  });
}

function renderCoItemGrid(){
  const items = coActiveCategory==='All' ? posItems : posItems.filter(it=>(it.category||'General')===coActiveCategory);
  if(items.length===0){
    $('#coItemGrid').innerHTML = '<div class="empty">Nothing on the menu yet — please check with the counter.</div>';
    return;
  }
  $('#coItemGrid').innerHTML = items.map(it=>{
    const outOfStock = it.trackStock && (it.stock||0) <= 0;
    return `
    <div class="pos-item-btn ${outOfStock ? 'out-of-stock' : ''}" data-id="${it.id}">
      <div class="pi-name">${it.name}</div>
      <div class="pi-price">${fmt(it.price)} Sl.sh</div>
    </div>`;
  }).join('');
  $$('#coItemGrid .pos-item-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> addToCoCart(Number(btn.dataset.id)));
  });
}

function addToCoCart(itemId){
  const item = posItems.find(it=>it.id===itemId);
  if(!item) return;
  const line = coCart.find(c=>c.itemId===itemId);
  if(line){ line.qty += 1; } else { coCart.push({ itemId, name: item.name, price: item.price, qty: 1 }); }
  renderCoCart();
}

function renderCoCart(){
  if(coCart.length===0){
    $('#coCartList').innerHTML = '<div class="empty" style="padding:14px 0;">Tap items above to add them to your order.</div>';
  }else{
    $('#coCartList').innerHTML = coCart.map((c,i)=>`
      <div class="pos-cart-row">
        <span class="pc-name">${c.name}</span>
        <span class="pc-qty-controls">
          <button class="pc-qty-btn" data-action="dec" data-i="${i}">−</button>
          <span>${c.qty}</span>
          <button class="pc-qty-btn" data-action="inc" data-i="${i}">+</button>
        </span>
        <span class="pc-total">${fmt(c.price*c.qty)}</span>
        <button class="pc-remove" data-action="rm" data-i="${i}">✕</button>
      </div>
    `).join('');
    $$('#coCartList [data-action]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const i = Number(btn.dataset.i);
        if(btn.dataset.action==='inc') coCart[i].qty += 1;
        if(btn.dataset.action==='dec'){ coCart[i].qty -= 1; if(coCart[i].qty<=0) coCart.splice(i,1); }
        if(btn.dataset.action==='rm') coCart.splice(i,1);
        renderCoCart();
      });
    });
  }
  const total = coCart.reduce((s,c)=>s+c.price*c.qty, 0);
  $('#coCartTotal').textContent = fmt(total) + ' Sl.sh';
  $('#coSubmitBtn').disabled = coCart.length===0;
}

function populateCoCustomerDropdown(){
  const sel = $('#coCustomerSelect');
  if(!sel) return;
  const q = ($('#coCustomerSearch').value || '').trim().toLowerCase();
  const previousValue = sel.value;
  const filtered = q
    ? customers.filter(c => (c.name||'').toLowerCase().includes(q) || (c.phone||'').toLowerCase().includes(q))
    : customers;
  const options = filtered.map(c=>`<option value="${c.id}">${c.name}${c.phone ? ' — ' + c.phone : ''}</option>`).join('');
  sel.innerHTML = options + `<option value="__new__">+ I'm a new customer</option>`;
  if(filtered.some(c=>String(c.id)===previousValue) || previousValue==='__new__'){
    sel.value = previousValue;
  }else if(filtered.length && !q){
    sel.value = String(filtered[0].id);
  }else if(!filtered.length){
    sel.value = '__new__';
  }
  toggleCoNewCustomerFields();
}
function toggleCoNewCustomerFields(){
  const isNew = !$('#coCustomerSelect').value || $('#coCustomerSelect').value === '__new__';
  $('#coNewCustomerFields').style.display = isNew ? '' : 'none';
}
$('#coCustomerSelect').addEventListener('change', toggleCoNewCustomerFields);
$('#coCustomerSearch').addEventListener('input', populateCoCustomerDropdown);

function renderCoPaymentInfo(){
  const el = $('#coPaymentInfo');
  if(!el) return;
  el.innerHTML = `
    <b>Pay Ahead / At Counter:</b><br>
    Zaad: ${PAYMENT_INFO.zaad} &nbsp;·&nbsp; eDahab: ${PAYMENT_INFO.edahab}<br>
    Waafi: ${PAYMENT_INFO.waafi} &nbsp;·&nbsp; DahabPlus: ${PAYMENT_INFO.dahabplus}<br>
    Premier Wallet: ${PAYMENT_INFO.premierWallet}<br>
    ${PAYMENT_INFO.bankName} — ${PAYMENT_INFO.accountNumber}
  `;
}

async function renderCustomerOrderScreen(){
  await loadPosItems();
  await loadCustomers();
  coCart = [];
  coActiveCategory = 'All';
  $('#coOrderForm').style.display = '';
  $('#coConfirmation').style.display = 'none';
  $('#coCustomerSearch').value = '';
  $('#coNewCustName').value = '';
  $('#coNewCustPhone').value = '';
  $('#coNote').value = '';
  $('#coMsg').className = 'msg';
  renderCoCategoryBar();
  renderCoItemGrid();
  renderCoCart();
  renderCoPaymentInfo();
  populateCoCustomerDropdown();
}

$('#coSubmitBtn').addEventListener('click', async ()=>{
  if(coCart.length===0) return;
  const btn = $('#coSubmitBtn');
  const msg = $('#coMsg');
  btn.disabled = true;
  try{
    await loadSaleRequests(); // refresh so we don't clobber requests submitted elsewhere in the meantime
    await loadCustomers();

    const selVal = $('#coCustomerSelect').value;
    let customerId = null;
    let name;
    if(!selVal || selVal === '__new__'){
      name = $('#coNewCustName').value.trim();
      if(!name){ msg.textContent='Please enter your name.'; msg.className='msg show err'; return; }
      const newCustomer = { id: Date.now(), name, phone: $('#coNewCustPhone').value.trim(), address: '' };
      customers.push(newCustomer);
      await saveCustomers();
      customerId = newCustomer.id;
    }else{
      customerId = Number(selVal);
      const existing = customers.find(c=>c.id===customerId);
      name = existing ? existing.name : 'Guest';
    }

    const note = $('#coNote').value.trim();
    const request = {
      id: Date.now(),
      source: 'customer',
      customerId,
      customerName: name,
      items: coCart.map(c=>({ itemId:c.itemId, name:c.name, price:c.price, qty:c.qty })),
      note,
      status: 'pending',
      createdAt: new Date().toISOString()
    };
    saleRequests.push(request);
    await saveSaleRequests();

    $('#coOrderForm').style.display = 'none';
    $('#coConfirmation').style.display = '';
    $('#coConfirmationText').textContent = `Thanks ${name}! Your order has been sent to the counter${note ? ' (' + note + ')' : ''}. Please pay when it's ready.`;
  }catch(e){
    console.error('Customer order failed:', e);
    msg.textContent = 'Something went wrong sending your order — please tell a staff member.';
    msg.className = 'msg show err';
  }finally{
    btn.disabled = coCart.length===0;
  }
});
$('#coNewOrderBtn').addEventListener('click', renderCustomerOrderScreen);

renderCustomerOrderScreen();

(function showSyncStatus(){
  const coEl = $('#coSyncStatusLine');
  if(!coEl) return;
  coEl.textContent = hasRealStorage
    ? '🟡 Using Claude\'s built-in storage — shared with others viewing this same conversation.'
    : '🟠 Using this browser\'s local storage only — data stays on this device.';
})();
</script>
</body>
